name: Build PayNest Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract PayNest Android project
        run: |
          unzip -q PayNest-Android-BUILD-v1.zip
          test -f PayNest-Android/settings.gradle
          test -f PayNest-Android/app/build.gradle

      - name: Build debug APK
        working-directory: PayNest-Android
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PayNest-debug-apk
          path: PayNest-Android/app/build/outputs/apk/debug/app-debug.apk
